<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Event Registration | Smart Event Portal</title>
    <meta name="description" content="Register for a college event at RCPIT Shirpur.">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/registration.css">
</head>
<body>

    <!-- NAVBAR -->
    <nav>
        <div class="logo">🎓 Event Portal</div>
        <div class="nav-links">
            <a href="index.html">Home</a>
            <a href="events.html" class="active">Events</a>
            <a href="certificate.html">Certificate</a>
            <a href="login.html">Login</a>
        </div>
    </nav>

    <!-- PAGE HEADING -->
    <div class="page-title">
        <h2>Event Registration</h2>
        <p>Fill the details below to register for the selected event.</p>
    </div>

    <!-- REGISTRATION FORM -->
    <div class="form-wrapper">
        <div class="form-box">

            <!-- selected event name comes from the URL (see registration.js) -->
            <div class="selected-event">
                Event Name: <span id="selectedEvent">Not Selected</span>
            </div>

            <!-- success message (hidden until the form is valid) -->
            <div id="successMsg" class="success-msg">Registration submitted successfully!</div>

            <form id="registrationForm" novalidate>

                <label for="fullName">Full Name *</label>
                <input type="text" id="fullName" placeholder="Enter your full name">
                <span class="error" id="errName"></span>

                <label for="rollNo">Roll Number *</label>
                <input type="text" id="rollNo" placeholder="Enter your roll number">
                <span class="error" id="errRoll"></span>

                <label for="prn">PRN *</label>
                <input type="text" id="prn" placeholder="Enter your PRN">
                <span class="error" id="errPrn"></span>

                <label for="email">Email *</label>
                <input type="text" id="email" placeholder="example@gmail.com">
                <span class="error" id="errEmail"></span>

                <label for="eventName">Event Name (auto filled)</label>
                <input type="text" id="eventName" readonly>

                <label for="branch">Branch *</label>
                <select id="branch">
                    <option value="">-- Select Branch --</option>
                    <option>Information Technology</option>
                    <option>Computer Engineering</option>
                    <option>Electronics &amp; Telecommunication</option>
                    <option>Mechanical Engineering</option>
                    <option>Civil Engineering</option>
                </select>
                <span class="error" id="errBranch"></span>

                <label for="year">Year *</label>
                <select id="year">
                    <option value="">-- Select Year --</option>
                    <option>First Year</option>
                    <option>Second Year</option>
                    <option>Third Year</option>
                    <option>Final Year</option>
                </select>
                <span class="error" id="errYear"></span>

                <div class="form-actions">
                    <button type="submit" class="btn-primary">Submit Registration</button>
                    <a href="events.html" class="btn-light">Back to Events</a>
                </div>

            </form>
        </div>
    </div>

    <!-- FOOTER -->
    <footer>
        <p>© 2026 Smart Event Portal | RCPIT Shirpur</p>
    </footer>

    <script src="js/registration.js"></script>
</body>
</html>
